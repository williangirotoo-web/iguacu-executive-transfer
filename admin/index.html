<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Painel de Reservas | Iguaçu Executive Transfer</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{--gold:#d4af37;--bg:#0b0b0b;--bg2:#141414;--bg3:#1b1b1b;--line:rgba(212,175,55,.2);--txt:#f0ede8;--mut:rgba(240,237,232,.6);--ok:#4caf50;--wa:#25d366;--bad:#ff8a80}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--bg2);position:sticky;top:0;z-index:5}
header b{color:var(--gold);letter-spacing:.06em}
header small{color:var(--mut)}
main{max-width:1200px;margin:0 auto;padding:18px 16px 60px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.chip{background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:20px;padding:6px 12px;font:inherit;font-size:12px;cursor:pointer}
.chip.on{background:var(--gold);color:#000;border-color:var(--gold)}
.chip i{font-style:normal;opacity:.7;margin-left:4px}
input,select,textarea{background:#0f0f0f;border:1px solid rgba(240,237,232,.2);border-radius:6px;color:var(--txt);padding:8px 10px;font:inherit}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:130px 1fr 150px 130px 120px;gap:12px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer}
.row:hover{border-color:var(--gold)}
.row .when b{display:block}
.row .svc{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:inline-block;border-radius:12px;padding:2px 10px;font-size:11px;font-weight:600;background:#333}
.st-solicitacao{background:#5c4a00;color:#ffe08a}.st-pagamento_pendente{background:#4a3b00;color:#ffd54f}.st-aprovado{background:#0d3b4a;color:#80deea}
.st-aguardando_confirmacao{background:#3b2a4a;color:#ce93d8}.st-confirmada{background:#1b4a20;color:#a5d6a7}.st-concluida{background:#263238;color:#b0bec5}.st-cancelada{background:#4a1b1b;color:#ef9a9a}
.empty,.msg{color:var(--mut);padding:30px;text-align:center}
.det{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:18px}
.det h2{margin:0 0 4px;font-size:20px}.det h3{margin:18px 0 8px;font-size:14px;color:var(--gold);text-transform:uppercase;letter-spacing:.06em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.item{border:1px solid rgba(240,237,232,.12);border-radius:8px;padding:12px;margin-bottom:8px;background:var(--bg3)}
.item b{display:block;margin-bottom:4px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 10px;font-size:13px}.kv span:nth-child(odd){color:var(--mut)}
.btn{display:inline-block;background:var(--gold);color:#000;border:0;border-radius:6px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.wa{background:var(--wa);color:#fff}.btn.gh{background:transparent;color:var(--txt);border:1px solid var(--line)}
.ev{font-size:12px;color:var(--mut);border-left:2px solid var(--line);padding:2px 0 8px 10px}
.ev b{color:var(--txt)}
.tot{font-size:16px}.tot b{color:var(--gold)}
@media(max-width:800px){.row{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.kv{grid-template-columns:120px 1fr}}
</style>
</head>
<body>
<header><div><b>IGUAÇU</b> · Painel de reservas</div><small id="who"></small></header>
<main>
  <section id="lista">
    <div class="bar" id="chips"></div>
    <div class="bar">
      <select id="periodo"><option value="proximos">Próximas viagens</option><option value="todos">Todos os pedidos (mais recentes)</option></select>
      <input id="q" type="search" placeholder="Buscar código, nome, e-mail ou telefone" style="flex:1;min-width:220px">
      <button class="btn gh" id="recarregar" type="button">Atualizar</button>
    </div>
    <div class="list" id="rows"><p class="msg">Carregando…</p></div>
  </section>
  <section id="detalhe" hidden></section>
</main>
<script src="/admin/admin.js?v=1"></script>
</body>
</html>
