<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Visitas | Painel Iguaçu Executive Transfer</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="icon" type="image/png" sizes="96x96" href="/img/favicon-96.png">
<style>
:root{--gold:#d4af37;--bg:#0b0b0b;--bg2:#141414;--bg3:#1b1b1b;--line:rgba(212,175,55,.2);--txt:#f0ede8;--mut:rgba(240,237,232,.6);--ok:#4caf50;--wa:#25d366;--bad:#ff8a80}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--bg2);position:sticky;top:0;z-index:5}
header b{color:var(--gold);letter-spacing:.06em}
header small{color:var(--mut)}
main{max-width:1200px;margin:0 auto;padding:18px 16px 60px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.chip{background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:20px;padding:6px 12px;font:inherit;font-size:12px;cursor:pointer}
.chip.on{background:var(--gold);color:#000;border-color:var(--gold)}
.chip i{font-style:normal;opacity:.7;margin-left:4px}
input,select,textarea{background:#0f0f0f;border:1px solid rgba(240,237,232,.2);border-radius:6px;color:var(--txt);padding:8px 10px;font:inherit}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:130px 1fr 150px 130px 120px;gap:12px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer}
.row:hover{border-color:var(--gold)}
.row .when b{display:block}
.row .svc{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:inline-block;border-radius:12px;padding:2px 10px;font-size:11px;font-weight:600;background:#333}
.st-solicitacao{background:#5c4a00;color:#ffe08a}.st-pagamento_pendente{background:#4a3b00;color:#ffd54f}.st-aprovado{background:#0d3b4a;color:#80deea}
.st-aguardando_confirmacao{background:#3b2a4a;color:#ce93d8}.st-confirmada{background:#1b4a20;color:#a5d6a7}.st-concluida{background:#263238;color:#b0bec5}.st-cancelada{background:#4a1b1b;color:#ef9a9a}
.empty,.msg{color:var(--mut);padding:30px;text-align:center}
.det{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:18px}
.det h2{margin:0 0 4px;font-size:20px}.det h3{margin:18px 0 8px;font-size:14px;color:var(--gold);text-transform:uppercase;letter-spacing:.06em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.item{border:1px solid rgba(240,237,232,.12);border-radius:8px;padding:12px;margin-bottom:8px;background:var(--bg3)}
.item b{display:block;margin-bottom:4px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 10px;font-size:13px}.kv span:nth-child(odd){color:var(--mut)}
.btn{display:inline-block;background:var(--gold);color:#000;border:0;border-radius:6px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.wa{background:var(--wa);color:#fff}.btn.gh{background:transparent;color:var(--txt);border:1px solid var(--line)}
.ev{font-size:12px;color:var(--mut);border-left:2px solid var(--line);padding:2px 0 8px 10px}
.ev b{color:var(--txt)}
.tot{font-size:16px}.tot b{color:var(--gold)}
@media(max-width:800px){.row{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.kv{grid-template-columns:120px 1fr}}
.st-novo{background:#5c4a00;color:#ffe08a}.st-aprovado{background:#1b4a20;color:#a5d6a7}.st-pausado{background:#263238;color:#b0bec5}.st-recusado{background:#4a1b1b;color:#ef9a9a}
.rowp{display:grid;grid-template-columns:110px 1fr 170px 120px 110px;gap:12px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer}.rowp:hover{border-color:var(--gold)}
header nav a{color:var(--txt);margin-left:14px;text-decoration:none}header nav a.on{color:var(--gold)}
.link{word-break:break-all;background:#0f0f0f;border:1px dashed var(--line);border-radius:6px;padding:10px;margin:8px 0}
@media(max-width:800px){.rowp{grid-template-columns:1fr 1fr}header{flex-wrap:wrap}header nav a{margin:0 10px 0 0}}

.svc{color:var(--mut);font-size:12px}.ed{color:var(--gold)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--bg2)}td,th{padding:6px 8px;border-bottom:1px solid rgba(240,237,232,.08);text-align:left;vertical-align:middle}
th{color:var(--gold);font-weight:600;font-size:11px;text-transform:uppercase;position:sticky;top:0;background:var(--bg2)}
td.n{min-width:240px}td.n small{display:block;color:var(--mut)}
td input{width:96px;padding:5px 7px}td input.mud{border-color:var(--gold);background:#1f1a08}td input.edt{color:var(--gold)}
td .pad{display:block;color:var(--mut);font-size:10px}
tr.g td{background:var(--bg3);color:var(--gold);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.06em}
td.n{position:sticky;left:0;background:var(--bg2);z-index:1}
@media(max-width:800px){header{flex-wrap:wrap}header nav a{margin:0 10px 0 0}td.n{min-width:150px;max-width:170px;font-size:12px}td input{width:78px}}
.cp-new{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}.cp-new label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}.cp-new input{width:150px}.cp-new .w input{width:240px}.ok{color:#a5d6a7}.off{color:#ef9a9a}

.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:14px}.card small{display:block;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.06em}.card b{font-size:26px;color:var(--gold)}
.cols{display:grid;grid-template-columns:2fr 1fr;gap:16px}.box{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:14px}.box h3{margin:0 0 10px;font-size:13px;color:var(--gold);text-transform:uppercase;letter-spacing:.06em}
.lin{display:grid;grid-template-columns:1fr 70px;gap:8px;align-items:center;font-size:13px;padding:5px 0;border-bottom:1px solid rgba(240,237,232,.06)}.lin span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lin i{display:block;height:4px;background:var(--gold);border-radius:2px;margin-top:3px;opacity:.7}.lin b{text-align:right}
.graf{display:flex;align-items:flex-end;gap:3px;height:140px;padding-top:10px}.graf div{flex:1;background:var(--gold);opacity:.75;border-radius:3px 3px 0 0;min-height:2px;position:relative}.graf div:hover{opacity:1}.eixo{display:flex;justify-content:space-between;color:var(--mut);font-size:11px;margin-top:4px}
@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div><b>IGUAÇU</b> · Painel <nav style="display:inline"><a href="/admin/">Reservas</a><a href="/admin/parceiros.html">Parceiros</a><a href="/admin/comissoes.html">Comissões</a><a href="/admin/precos.html">Preços</a><a href="/admin/cupons.html">Cupons</a><a href="/admin/conversas.html">Conversas</a><a class="on" href="/admin/visitas.html">Visitas</a></nav></div><small id="who"></small></header>
<main>
  <div class="bar" id="per"><button class="chip" data-d="1">Hoje</button><button class="chip on" data-d="7">7 dias</button><button class="chip" data-d="30">30 dias</button><button class="chip" data-d="90">90 dias</button></div>
  <div id="out"><p class="msg">Carregando…</p></div>
  <p class="svc">Contagem do próprio site, sem cookies (robôs de busca não entram). Visitante único é contado por dia. Os números podem ser um pouco diferentes do Google Analytics.</p>
</main>
<script src="/admin/visitas.js?v=1"></script>
</body>
</html>
