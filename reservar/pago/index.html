<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pagamento | Iguaçu Executive Transfer</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{--gold:#d4af37;--bg:#0b0b0b;--bg2:#141414;--line:rgba(212,175,55,.22);--txt:#f0ede8;--mut:rgba(240,237,232,.65)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--txt);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.box{max-width:520px;width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:28px 22px;text-align:center}
.logo{color:var(--gold);font-weight:700;letter-spacing:.12em;text-decoration:none;font-size:.9rem}
h1{font-size:1.45rem;margin:18px 0 8px}p{color:var(--mut);margin:8px 0}
.ok{width:58px;height:58px;border-radius:50%;margin:18px auto 0;display:flex;align-items:center;justify-content:center;background:rgba(76,175,80,.15);color:#81c784}
.wait{width:58px;height:58px;border-radius:50%;margin:18px auto 0;border:3px solid rgba(212,175,55,.25);border-top-color:var(--gold);animation:g 1s linear infinite}@keyframes g{to{transform:rotate(360deg)}}
.btn{display:inline-block;margin:14px 6px 0;background:var(--gold);color:#000;border-radius:8px;padding:12px 18px;font-weight:700;text-decoration:none}
.btn.wa{background:#25d366;color:#fff}
code{color:var(--gold)}
</style>
</head>
<body>
<main class="box">
  <a class="logo" href="/">IGUAÇU EXECUTIVE TRANSFER</a>
  <section id="carregando"><div class="wait" aria-hidden="true"></div><h1 data-t="t1"></h1><p data-t="t2"></p></section>
  <section id="pago" hidden>
    <div class="ok" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h1 data-t="ok1"></h1>
    <p><span data-t="ok2"></span> <code class="cod"></code> <span data-t="ok3"></span></p>
    <a class="btn wa" href="https://wa.me/5545991185798" target="_blank" rel="noopener" data-t="wa"></a>
  </section>
  <section id="pendente" hidden>
    <h1 data-t="p1"></h1>
    <p><span data-t="p2"></span> <code class="cod"></code> <span data-t="p3"></span></p>
    <p data-t="p4"></p>
    <a class="btn wa" href="https://wa.me/5545991185798" target="_blank" rel="noopener" data-t="wa"></a>
  </section>
  <section id="cancelado" hidden>
    <h1 data-t="c1"></h1>
    <p><span data-t="c2"></span> <code class="cod"></code> <span data-t="c3"></span></p>
    <a class="btn wa" href="https://wa.me/5545991185798" target="_blank" rel="noopener" data-t="wa"></a>
  </section>
</main>
<script>
(function(){
  var T={
    pt:{t1:"Conferindo o pagamento…",t2:"Só um instante.",ok1:"Pagamento recebido. Obrigado!",ok2:"O pagamento da reserva",ok3:"foi confirmado. Qualquer dúvida, fale com a gente pelo WhatsApp.",p1:"Ainda não recebemos a confirmação",p2:"Se você pagou por Pix ou cartão, a confirmação pode levar alguns minutos. Assim que chegar, a reserva",p3:"é atualizada.",p4:"Se não concluiu o pagamento, abra de novo o link que enviamos pelo WhatsApp.",c1:"Pagamento não concluído",c2:"A reserva",c3:"está guardada, mas ainda sem pagamento. Fale com a gente pelo WhatsApp para receber o link de novo.",wa:"Falar no WhatsApp",msg:"Olá! Sobre a reserva "},
    en:{t1:"Checking your payment…",t2:"Just a moment.",ok1:"Payment received. Thank you!",ok2:"The payment for booking",ok3:"is confirmed. Any questions, message us on WhatsApp.",p1:"We haven't received the confirmation yet",p2:"It can take a few minutes. As soon as it arrives, booking",p3:"will be updated.",p4:"If you did not finish paying, open the payment link again or message us.",c1:"Payment not completed",c2:"Booking",c3:"is saved but not paid yet. Message us on WhatsApp and we'll send the payment link again.",wa:"Message us on WhatsApp",msg:"Hello! About booking "},
    es:{t1:"Verificando el pago…",t2:"Un momento.",ok1:"Pago recibido. ¡Gracias!",ok2:"El pago de la reserva",ok3:"está confirmado. Cualquier duda, escríbanos por WhatsApp.",p1:"Todavía no recibimos la confirmación",p2:"Puede tardar unos minutos. Cuando llegue, la reserva",p3:"se actualizará.",p4:"Si no terminó el pago, abra de nuevo el link o escríbanos.",c1:"Pago no completado",c2:"La reserva",c3:"está guardada, pero sin pago. Escríbanos por WhatsApp y le enviamos el link de nuevo.",wa:"Escribir por WhatsApp",msg:"¡Hola! Sobre la reserva "}};
  var q=new URLSearchParams(location.search),lang=T[q.get("lang")]?q.get("lang"):"pt",tx=T[lang];
  if(lang!=="pt")document.documentElement.lang=lang;
  var cod=(q.get("pedido")||"").replace(/[^A-Z0-9-]/g,"").slice(0,12);
  document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=tx[e.dataset.t]});
  document.querySelectorAll(".cod").forEach(function(e){e.textContent=cod});
  document.querySelectorAll(".wa").forEach(function(e){e.href="https://wa.me/5545991185798?text="+encodeURIComponent(tx.msg+cod+".")});
  function mostrar(id){["carregando","pago","pendente","cancelado"].forEach(function(x){document.getElementById(x).hidden=x!==id})}
  if(q.get("cancelado")){mostrar("cancelado");return}
  var url,dados;
  if(q.get("pp")){url="/api/pagamentos/paypal/capturar";dados={order_nsu:q.get("pp"),token:q.get("token")}}
  else{url="/api/pagamentos/conferir";dados={order_nsu:q.get("order_nsu"),transaction_nsu:q.get("transaction_nsu"),slug:q.get("slug"),capture_method:q.get("capture_method"),receipt_url:q.get("receipt_url")}}
  if(!dados.order_nsu||!(dados.slug||dados.token)){mostrar("pendente");return}
  history.replaceState(null,"",location.pathname+"?pedido="+cod+(lang!=="pt"?"&lang="+lang:""));
  var tentativas=0;
  (function conferir(){
    fetch(url,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(dados)})
      .then(function(r){return r.json()}).then(function(r){
        if(r.pago){mostrar("pago");return}
        if(++tentativas<4)setTimeout(conferir,4000);else mostrar("pendente");
      }).catch(function(){if(++tentativas<4)setTimeout(conferir,4000);else mostrar("pendente")});
  })();
})();
</script>
</body>
</html>
